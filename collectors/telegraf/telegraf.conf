# Telegraf — Metrics collector sidecar
# Receives OTLP metrics on localhost:4319 (gRPC), forwards to the Databricks Zerobus OTLP endpoint.
# Note: Telegraf's internal model drops optional histogram fields (min/max/start_time_unix_nano)
# but Databricks accepts the payloads — those fields are optional in the OTLP spec.
#
# Environment variables (set by start-all.sh):
#   ZB_TOKEN_TELEGRAF_METRICS — Zerobus token scoped to bldemos.otel.telegraf_otel_metrics

[agent]
  interval = "5s"
  round_interval = true
  flush_interval = "5s"
  flush_jitter = "0s"
  omit_hostname = false

# Accept OTLP metrics over gRPC on port 4319
[[inputs.opentelemetry]]
  service_address = "0.0.0.0:4319"

# Forward to Databricks via OTLP/HTTP (protobuf over HTTPS)
[[outputs.opentelemetry]]
  # Previous: workspace REST endpoint (no longer in the docs)
  # service_address = "https://fevm-bobertx3-aws-fevm.cloud.databricks.com:443/api/2.0/otel/v1/metrics"

  # Current: Zerobus Ingest OTLP endpoint
  service_address = "https://7474645374628060.zerobus.us-east-1.cloud.databricks.com:443/v1/metrics"
  encoding_type = "protobuf"
  timeout = "10s"

  [outputs.opentelemetry.headers]
    Authorization = "Bearer ${ZB_TOKEN_TELEGRAF_METRICS}"

    # Previous headers (workspace REST endpoint)
    # X-Databricks-UC-Table-Name = "bldemos.otel.telegraf_otel_metrics"
    # X-Databricks-Workspace-Url = "https://fevm-bobertx3-aws-fevm.cloud.databricks.com"

    # Current header (Zerobus)
    x-databricks-zerobus-table-name = "bldemos.otel.telegraf_otel_metrics"
