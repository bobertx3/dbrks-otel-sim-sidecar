# Vector — Logs collector sidecar
# Receives OTLP on localhost:4322, forwards logs to the Databricks Zerobus OTLP endpoint.
#
# Environment variables (set by start-all.sh):
#   ZB_TOKEN_VECTOR_LOGS — Zerobus token scoped to bldemos.otel.vector_otel_logs

sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:14322"
    http:
      address: "0.0.0.0:4322"
    use_otlp_decoding: true

sinks:
  # Logs: use OTLP protobuf encoding (http sink supports otlp codec for logs)
  databricks_logs:
    type: http
    inputs: ["otlp.logs"]

    # Previous: workspace REST endpoint (no longer in the docs)
    # uri: "https://fevm-bobertx3-aws-fevm.cloud.databricks.com/api/2.0/tracing/otel/v1/logs"

    # Current: Zerobus Ingest OTLP endpoint
    uri: "https://7474645374628060.zerobus.us-east-1.cloud.databricks.com/v1/logs"
    method: post
    encoding:
      codec: otlp
    request:
      headers:
        Authorization: "Bearer ${ZB_TOKEN_VECTOR_LOGS}"
        Content-Type: "application/x-protobuf"

        # Previous headers (workspace REST endpoint)
        # X-Databricks-UC-Table-Name: "bldemos.otel.vector_otel_logs"
        # X-Databricks-Workspace-Url: "https://fevm-bobertx3-aws-fevm.cloud.databricks.com"

        # Current header (Zerobus)
        x-databricks-zerobus-table-name: "bldemos.otel.vector_otel_logs"
