# Fluent Bit — Log collector sidecar
# Receives OTLP logs on localhost:4318, forwards to the Databricks Zerobus OTLP endpoint.
#
# Environment variables (set by start-all.sh):
#   DATABRICKS_TOKEN  — Zerobus token scoped to bldemos.otel.fluentbit_otel_logs
#                       (refreshed by start-fluent-bit.sh)

service:
  flush: 2
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: opentelemetry
      listen: 0.0.0.0
      port: 4318
      tag: otel.logs

  outputs:
    - name: opentelemetry
      match: "*"

      # Previous: workspace REST endpoint (no longer in the docs)
      # host: fevm-bobertx3-aws-fevm.cloud.databricks.com
      # logs_uri: /api/2.0/tracing/otel/v1/logs

      # Current: Zerobus Ingest OTLP endpoint
      host: 7474645374628060.zerobus.us-east-1.cloud.databricks.com
      logs_uri: /v1/logs

      port: 443
      tls: on
      tls.verify: on
      compress: gzip
      header:
        - Authorization Bearer ${DATABRICKS_TOKEN}
        - x-databricks-zerobus-table-name bldemos.otel.fluentbit_otel_logs
        # Previous headers (workspace REST endpoint)
        # - X-Databricks-UC-Table-Name bldemos.otel.fluentbit_otel_logs
        # - X-Databricks-Workspace-Url https://fevm-bobertx3-aws-fevm.cloud.databricks.com

        # Current header (Zerobus)

